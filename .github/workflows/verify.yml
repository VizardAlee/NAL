name: Verify web app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install --global firebase-tools@15.24.0
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  deploy-firebase-backend:
    name: Deploy Firebase backend
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.FIREBASE_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: google-github-actions/auth@v3
        with:
          project_id: studio-1298078893-e7941
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: npm ci --prefix functions
      - run: npm install --global firebase-tools@15.24.0
      - name: Deploy Functions, Firestore, and Storage
        run: >-
          firebase deploy
          --project studio-1298078893-e7941
          --only functions,firestore,storage
          --non-interactive
