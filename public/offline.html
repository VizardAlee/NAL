<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b593f" />
    <title>NAL — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f8faf9;
        color: #10231c;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }

      main {
        max-width: 420px;
      }

      img {
        border-radius: 24px;
        height: 112px;
        width: 112px;
      }

      h1 {
        font-size: 2rem;
        margin: 24px 0 12px;
      }

      p {
        color: #52635c;
        line-height: 1.6;
        margin: 0 0 24px;
      }

      a {
        background: #0b593f;
        border-radius: 10px;
        color: #fff;
        display: inline-block;
        font-weight: 700;
        padding: 12px 22px;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #07120e;
          color: #f4faf7;
        }

        p {
          color: #b5c6be;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="NAL" width="112" height="112" />
      <h1>You are offline</h1>
      <p>Your secure NAL data has not been changed. Reconnect to the internet before making a transaction or submitting a request.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
